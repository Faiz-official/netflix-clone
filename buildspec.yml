version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
    ECR_REPOSITORY_URI: 128572030294.dkr.ecr.ap-south-1.amazonaws.com/netflix-clone
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 128572030294.dkr.ecr.ap-south-1.amazonaws.com
  build:
    commands:
      - echo Building Docker image...
      - docker build -t netflix-clone .
      - docker tag netflix-clone:$IMAGE_TAG $ECR_REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
      - echo Build completed successfully.

artifacts:
  files:
    - '**/*'
